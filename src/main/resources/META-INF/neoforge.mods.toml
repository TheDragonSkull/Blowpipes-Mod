    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.blowpipemod]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.blowpipemod]]
    modId="moonlight"
    mandatory=true
    versionRange="[moonlight-1.21-2.17.37-neoforge,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.blowpipemod]]
    modId="curios"
    mandatory=true
    versionRange="[9.4.0+1.21.1,)"
    ordering="NONE"
    side="BOTH"